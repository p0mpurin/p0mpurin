name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#d9c9b0&color_dots=#111419,#1f2a36,#3a4d63,#6a8199,#9fb3c8&color_background=transparent
            dist/snake-light.svg?color_snake=#4a5f78&color_dots=#ebedf0,#d6dee7,#b3c2d2,#8199b2,#4a5f78

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

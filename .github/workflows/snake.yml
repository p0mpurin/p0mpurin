name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7EBEA5&color_dots=#0d1110,#123326,#1d5a43,#3f8f71,#7EBEA5&color_background=transparent
            dist/snake-light.svg?color_snake=#3f8f71&color_dots=#ebedf0,#cfe9df,#a9d6c4,#7EBEA5,#3f8f71

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

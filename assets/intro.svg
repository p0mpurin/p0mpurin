<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-label="hello, i'm p0mpurin">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fb3c8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d9c9b0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d9c9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fb3c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9fb3c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#9fb3c8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9fb3c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .wrap { width: 1200px; height: 268px; box-sizing: border-box; padding: 1px; border-radius: 15px;
      background: linear-gradient(110deg, #1f242c 0%, #1f242c 38%, rgba(159,179,200,.55) 48%,
                  rgba(217,201,176,.45) 53%, #1f242c 63%, #1f242c 100%);
      background-size: 300% 100%; animation: sheen 10s linear infinite; }
    .card { position: relative; height: 100%; box-sizing: border-box; border-radius: 14px; overflow: hidden;
      background: #0b0d11; padding: 46px 48px; display: grid; grid-template-columns: 1fr 1px 360px;
      column-gap: 44px; align-items: center; font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; }
    .b1 { width: 460px; height: 300px; left: -120px; top: -160px; background: #9fb3c8; opacity: .16;
      animation: drift 16s ease-in-out infinite alternate; }
    .b2 { width: 380px; height: 220px; right: -60px; bottom: -170px; background: #d9c9b0; opacity: .10;
      animation: drift 20s ease-in-out infinite alternate-reverse; }
    .left, .right, .rule { position: relative; }
    .hello { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: 4px;
      color: #9fb3c8; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #d9c9b0;
      animation: pulse 3.2s ease-out infinite; }
    h1 { margin: 20px 0 0; font-size: 31px; line-height: 41px; font-weight: 300; color: #e9edf2; }
    .soft { background: linear-gradient(90deg, #d9c9b0, #9fb3c8); -webkit-background-clip: text;
      background-clip: text; color: transparent; }
    p { margin: 18px 0 0; font-size: 15px; color: #8e98a6; }
    .rule { align-self: stretch; background: linear-gradient(180deg, transparent, #1f242c 20%, #1f242c 80%, transparent); }
    dl { margin: 0; display: grid; grid-template-columns: 82px 1fr; row-gap: 15px; align-items: baseline; }
    dt { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #8e98a6; }
    dd { margin: 0; font-size: 14.5px; color: #c3ccd6; }
    .prompt { margin-top: 22px; font: 11.5px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; color: #4a525e; }
    .caret { display: inline-block; width: 7px; height: 13px; margin-left: 4px; vertical-align: -2px;
      background: #9fb3c8; opacity: .7; animation: blink 1.1s steps(1) infinite; }
    @keyframes sheen { from { background-position: 100% 0; } to { background-position: 0% 0; } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(60px, 24px); } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(217,201,176,.45); } 70%, 100% { box-shadow: 0 0 0 9px rgba(217,201,176,0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .wrap, .blob, .dot, .caret { animation: none; } }
  </style>
  <foreignObject x="0" y="0" width="1200" height="268">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap"><div class="card">
      <div class="blob b1"></div><div class="blob b2"></div>
      <div class="left">
        <div class="hello"><span class="dot"></span>hello, i'm p0mpurin</div>
        <h1>I make homebrew, desktop apps<br/>and <span class="soft">small things</span> for the web.</h1>
        <p>old hardware, simple interfaces, software that stays out of the way.</p>
      </div>
      <div class="rule"></div>
      <div class="right">
        <dl><dt>focus</dt><dd>3ds homebrew</dd><dt>also</dt><dd>desktop apps · extensions · web</dd><dt>stack</dt><dd>c · c++ · rust · python · ts</dd><dt>since</dt><dd>2024 · 50+ repositories</dd></dl>
        <div class="prompt">~/p0mpurin $ ls ./projects<span class="caret"></span></div>
      </div>
    </div></div>
  </foreignObject>
</svg>

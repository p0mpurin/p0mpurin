<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="60" viewBox="0 0 1200 60" role="img" aria-label="thanks for stopping by">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fb3c8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9fb3c8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9fb3c8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .msg { font: 400 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 5px; fill: #8e98a6; }
    </style>
  </defs>
  <rect x="200" y="14" width="800" height="1" fill="url(#line)"/>
  <text class="msg" x="600" y="46" text-anchor="middle">thanks for stopping by</text>
</svg>

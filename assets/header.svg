<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="p0mpurin">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfe9df" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7EBEA5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7EBEA5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f7f4"/>
      <stop offset="100%" stop-color="#bcd8cc"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a25"/>
      <stop offset="100%" stop-color="#0b1210"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122019"/>
      <stop offset="100%" stop-color="#070b0a"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a110e"/>
      <stop offset="100%" stop-color="#030404"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
    <style>
      .mist  { animation: drift 26s ease-in-out infinite alternate; }
      .mist2 { animation: drift 34s ease-in-out infinite alternate-reverse; }
      .star  { animation: twinkle 4s ease-in-out infinite; }
      .s2 { animation-delay: 1.3s; } .s3 { animation-delay: 2.6s; }
      .fadein { animation: rise 1.6s ease-out both; }
      .fadein2 { animation: rise 1.6s ease-out 0.4s both; }
      @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
      @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .title { font: 600 68px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 6px; fill: #eef5f1; }
      .sub   { font: 400 19px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #7EBEA5; }
      .kanji { font: 300 120px 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'MS Mincho', serif; fill: #7EBEA5; fill-opacity: 0.10; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#000"/>

    <!-- stars -->
    <g fill="#dbeee6">
      <circle class="star" cx="120" cy="60" r="1.4"/>
      <circle class="star s2" cx="260" cy="38" r="1"/>
      <circle class="star s3" cx="410" cy="82" r="1.2"/>
      <circle class="star s2" cx="560" cy="30" r="1"/>
      <circle class="star" cx="700" cy="70" r="1.3"/>
      <circle class="star s3" cx="1060" cy="48" r="1.1"/>
      <circle class="star s2" cx="1140" cy="110" r="1"/>
      <circle class="star s3" cx="60" cy="140" r="1"/>
      <circle class="star" cx="1000" cy="150" r="0.9"/>
    </g>

    <!-- moon -->
    <circle cx="905" cy="118" r="120" fill="url(#moonGlow)"/>
    <circle cx="905" cy="118" r="44" fill="url(#moon)"/>
    <circle cx="890" cy="106" r="7" fill="#a9c9bb" fill-opacity="0.35"/>
    <circle cx="920" cy="132" r="5" fill="#a9c9bb" fill-opacity="0.3"/>

    <!-- far mountains -->
    <path fill="url(#far)" d="M0 270 L90 220 L170 248 L270 180 L360 236 L450 205 L560 250 L660 190 L760 238 L860 200 L960 246 L1060 210 L1200 244 L1200 380 L0 380 Z"/>

    <!-- mist band -->
    <g class="mist" filter="url(#blur)" fill="#7EBEA5" fill-opacity="0.10">
      <ellipse cx="300" cy="265" rx="320" ry="26"/>
      <ellipse cx="900" cy="258" rx="360" ry="22"/>
    </g>

    <!-- mid mountains -->
    <path fill="url(#mid)" d="M0 300 L120 255 L220 285 L340 232 L470 290 L590 248 L720 296 L840 252 L980 300 L1100 262 L1200 290 L1200 380 L0 380 Z"/>

    <g class="mist2" filter="url(#blur)" fill="#cfe9df" fill-opacity="0.07">
      <ellipse cx="600" cy="305" rx="520" ry="24"/>
    </g>

    <!-- near ridge -->
    <path fill="url(#near)" d="M0 335 L160 312 L300 330 L460 300 L620 334 L780 310 L940 336 L1080 316 L1200 330 L1200 380 L0 380 Z"/>

    <rect width="1200" height="380" fill="url(#fade)"/>

    <!-- kanji: 霞 (mist) -->
    <text class="kanji" x="1150" y="350" text-anchor="end">霞</text>

    <!-- text -->
    <g class="fadein">
      <text class="title" x="80" y="150">p0mpurin</text>
    </g>
    <g class="fadein2">
      <rect x="82" y="172" width="46" height="2" fill="#7EBEA5"/>
      <text class="sub" x="82" y="206">3DS HOMEBREW  ·  CLOUD GAMING  ·  CALM LITTLE APPS</text>
    </g>
  </g>
</svg>

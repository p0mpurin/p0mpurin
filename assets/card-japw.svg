<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="JAPW">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fb3c8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d9c9b0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d9c9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fb3c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9fb3c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#9fb3c8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9fb3c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .wrap { width: 600px; height: 200px; box-sizing: border-box; padding: 1px; border-radius: 15px;
      background: linear-gradient(110deg, #1f242c 0%, #1f242c 40%, rgba(159,179,200,.5) 49%,
                  rgba(217,201,176,.4) 53%, #1f242c 62%, #1f242c 100%);
      background-size: 300% 100%; animation: sheen 12s linear infinite; animation-delay: -4s; }
    .card { position: relative; height: 100%; box-sizing: border-box; border-radius: 14px; overflow: hidden;
      background: #0b0d11; padding: 26px 28px 24px; display: flex; flex-direction: column; font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .blob { position: absolute; border-radius: 50%; filter: blur(50px); pointer-events: none; }
    .b1 { width: 300px; height: 160px; left: -110px; top: -110px; background: #9fb3c8; opacity: .13; }
    .b2 { width: 220px; height: 120px; right: -80px; bottom: -90px; background: #3572A5; opacity: .08;
      animation: drift 14s ease-in-out infinite alternate; }
    .top, .title, .desc, .foot { position: relative; }
    .top { display: flex; justify-content: space-between; align-items: center;
      font: 11.5px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; color: #d9c9b0; }
    .arrow { font: 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #8e98a6; }
    .title { margin-top: 14px; font-size: 21px; font-weight: 600; letter-spacing: .4px; color: #e9edf2; }
    .desc { margin-top: 10px; font-size: 14px; line-height: 21px; color: #8e98a6; }
    .foot { margin-top: auto; display: flex; align-items: center; gap: 8px; }
    .chip { font: 11.5px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; color: #9fb3c8; padding: 3px 10px; border-radius: 11px;
      background: rgba(159,179,200,.06); border: 1px solid rgba(159,179,200,.28); }
    .lang { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #8e98a6; }
    .lang i { width: 8px; height: 8px; border-radius: 50%; background: #3572A5;
      box-shadow: 0 0 8px #3572A5; }
    @keyframes sheen { from { background-position: 100% 0; } to { background-position: 0% 0; } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-40px, -14px); } }
    @media (prefers-reduced-motion: reduce) { .wrap, .blob { animation: none; } }
  </style>
  <foreignObject x="0" y="0" width="600" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap"><div class="card">
      <div class="blob b1"></div><div class="blob b2"></div>
      <div class="top"><span>03</span><span class="arrow">↗</span></div>
      <div class="title">JAPW</div>
      <div class="desc">Just A Pinterest Wrapper. Feed, boards and downloads<br/>in its own quiet window.</div>
      <div class="foot"><span class="chip">flask</span><span class="chip">desktop</span><span class="lang"><i></i>Python</span></div>
    </div></div>
  </foreignObject>
</svg>
